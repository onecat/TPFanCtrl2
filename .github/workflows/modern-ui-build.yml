name: Modern UI Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/win11-modern-ui
    paths:
      - 'ui-modern/**'
      - '.github/workflows/modern-ui-build.yml'
      - 'fancontrol/sharedstate.h'
  pull_request:
    paths:
      - 'ui-modern/**'
      - '.github/workflows/modern-ui-build.yml'
      - 'fancontrol/sharedstate.h'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure native UI
        run: cmake -S ui-modern -B build-modern -A Win32
      - name: Build native UI
        run: cmake --build build-modern --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: TPFanCtrlModern-win32
          path: build-modern/Release/TPFanCtrlModern.exe
          if-no-files-found: error
